name: Video Downloader Bot
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
permissions:
  contents: read
concurrency:
  group: video-downloader-bot
  cancel-in-progress: true
jobs:
  run:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Deno JavaScript runtime
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install requirements
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Verify yt-dlp and JavaScript runtime
        run: python -m yt_dlp --version && deno --version
      - name: Start Local Telegram Bot API Server for large uploads
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -z "$TELEGRAM_API_ID" ] || [ -z "$TELEGRAM_API_HASH" ]; then
            echo "Local Bot API credentials not set; using standard Telegram API (about 50 MB limit)."
            echo "TELEGRAM_LOCAL_API=0" >> "$GITHUB_ENV"
            exit 0
          fi
          docker run -d --name telegram-bot-api \
            -p 127.0.0.1:8081:8081 \
            -e TELEGRAM_API_ID="$TELEGRAM_API_ID" \
            -e TELEGRAM_API_HASH="$TELEGRAM_API_HASH" \
            -e TELEGRAM_LOCAL=1 \
            aiogram/telegram-bot-api:latest
          ready=0
          for i in $(seq 1 45); do
            if curl --silent --fail "http://127.0.0.1:8081/bot$TELEGRAM_BOT_TOKEN/getMe" >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "Local Bot API Server failed to become ready."
            docker logs telegram-bot-api || true
            exit 1
          fi
          echo "TELEGRAM_LOCAL_API=1" >> "$GITHUB_ENV"
          echo "MAX_UPLOAD_MB=${{ vars.MAX_UPLOAD_MB || '1900' }}" >> "$GITHUB_ENV"
      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          MAX_DOWNLOAD_MB: ${{ vars.MAX_DOWNLOAD_MB || '500' }}
        run: python bot.py
